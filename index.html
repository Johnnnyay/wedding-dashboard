<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Johnny & Irene Wedding</title>
<script>
try {
  var m = localStorage.getItem('wedtheme'); if (m === 'light' || m === 'dark') document.documentElement.setAttribute('data-theme', m);
  var l = localStorage.getItem('wedlang'); if (l === 'zh') document.documentElement.lang = 'zh-CN';
} catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,600;1,6..96,500&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Limestone and boxwood from Hempstead House. Green = done/good, amber = needs attention soon, red = overdue. */
:root {
  color-scheme: light;
  --bg: #f4f5f1; --surface: #ffffff; --surface-2: #eceee8; --line: #dadfd5; --line-2: #c7cec3;
  --ink: #1d2320; --ink-2: #48514c; --muted: #6c756f;
  --green: #2d5a46; --green-soft: #e3ece6;
  --rose: #a2455d; --rose-soft: #f5e6ea;
  --amber: #8a5a0b; --amber-soft: #fbf0d9;
  --red: #b3261e; --red-soft: #fbe9e7;
  --blue: #2f5f9e; --blue-soft: #e5edf8;
  --display: "Bodoni Moda", Didot, Georgia, serif;
  --body: "Public Sans", system-ui, -apple-system, "Segoe UI", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --zh: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --zh-display: "Songti SC", "Noto Serif SC", "STSong", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121513; --surface: #191d1b; --surface-2: #212623; --line: #2e3531; --line-2: #3d4640;
    --ink: #e6e9e5; --ink-2: #b6bdb7; --muted: #8b948d;
    --green: #7cc3a1; --green-soft: #1a2a22;
    --rose: #e08aa0; --rose-soft: #2c1a20;
    --amber: #e3b25a; --amber-soft: #2a2113;
    --red: #f08a80; --red-soft: #2e1715;
    --blue: #8cb4f0; --blue-soft: #18233a;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121513; --surface: #191d1b; --surface-2: #212623; --line: #2e3531; --line-2: #3d4640;
  --ink: #e6e9e5; --ink-2: #b6bdb7; --muted: #8b948d;
  --green: #7cc3a1; --green-soft: #1a2a22;
  --rose: #e08aa0; --rose-soft: #2c1a20;
  --amber: #e3b25a; --amber-soft: #2a2113;
  --red: #f08a80; --red-soft: #2e1715;
  --blue: #8cb4f0; --blue-soft: #18233a;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
:lang(zh) body { line-height: 1.65; }
a { color: var(--green); }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; border-radius: 4px; }
button { font: inherit; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h2 { font-family: var(--display); font-weight: 600; font-size: clamp(1.5rem, 3vw, 1.9rem); line-height: 1.15; }
:lang(zh) h2, :lang(zh) .group-title h3, :lang(zh) .trip h2 { font-family: var(--display), var(--zh-display); }
h3 { font-size: 1rem; font-weight: 700; }
p { margin: 0; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.zh { font-family: var(--zh); }
.small { font-size: 13px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* Header + nav */
.top { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-inner { max-width: 1100px; margin: 0 auto; padding: 12px 20px 0; display: flex; flex-direction: column; gap: 10px; }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-family: var(--display); font-weight: 500; font-size: 1.45rem; line-height: 1.1; }
.brand h1 em { color: var(--rose); font-style: italic; }
.brand .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.brand-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.countdown { font-family: var(--mono); font-size: 13px; color: var(--green); background: var(--green-soft); border-radius: 999px; padding: 4px 12px; white-space: nowrap; }
:lang(zh) .countdown { font-family: var(--body); }
.hbtn { background: none; border: 1px solid var(--line); border-radius: 7px; padding: 4px 9px; color: var(--ink-2); font-size: 12px; cursor: pointer; white-space: nowrap; }
.hbtn:hover { border-color: var(--line-2); color: var(--ink); }
.langbtn b { color: var(--green); font-weight: 700; }
.langbtn i { font-style: normal; opacity: 0.45; margin: 0 3px; }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin: 0 -4px; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs a { padding: 9px 12px; color: var(--ink-2); text-decoration: none; font-weight: 500; font-size: 14px; border-bottom: 2px solid transparent; white-space: nowrap; }
nav.tabs a:hover { color: var(--ink); }
nav.tabs a.on { color: var(--green); border-bottom-color: var(--green); font-weight: 600; }

main { max-width: 1100px; margin: 0 auto; padding: 24px 20px 64px; }
.view { display: flex; flex-direction: column; gap: 28px; }
.view[hidden] { display: none; }
.block { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.block-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.lede { color: var(--ink-2); max-width: 70ch; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }

/* China trip panel */
.trip { padding: 18px 20px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 18px 28px; border-color: var(--rose); background: linear-gradient(0deg, var(--surface), var(--surface)) padding-box; }
@media (max-width: 860px) { .trip { grid-template-columns: minmax(0, 1fr); } }
.trip .lead { display: flex; flex-direction: column; gap: 10px; }
.trip .eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--rose); }
:lang(zh) .trip .eyebrow { letter-spacing: 0.04em; }
.trip h2 { font-size: clamp(1.4rem, 2.6vw, 1.7rem); }
.trip .figs { display: flex; gap: 20px; flex-wrap: wrap; }
.trip .figs div { display: flex; flex-direction: column; }
.trip .figs .v { font-family: var(--mono); font-size: 1.5rem; color: var(--rose); line-height: 1.2; }
.trip .figs .k { font-size: 12px; color: var(--muted); }
.trip .bar > i { background: var(--rose); }
.trip .list { border: 1px solid var(--line); border-radius: 8px; }

/* Stats */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat { padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat .v { font-family: var(--mono); font-size: 1.6rem; color: var(--ink); line-height: 1.2; }
.stat .k { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }
.stat .d { font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }
.stat.warn .v { color: var(--red); }
.stat.good .v { color: var(--green); }

.cols { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 900px) { .cols { grid-template-columns: minmax(0, 1fr); } }

/* Task rows */
.list { overflow: hidden; }
.row { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 10px 12px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: none; }
.row:hover { background: var(--surface-2); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line-2); }
.dot.doing { background: var(--blue); }
.dot.done { background: var(--green); }
.row .name { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.row .name a { color: var(--ink); text-decoration: none; font-weight: 500; overflow-wrap: anywhere; }
.row .name a:hover { color: var(--green); text-decoration: underline; }
.row.done .name a { color: var(--muted); text-decoration: line-through; font-weight: 400; }
.row .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.row .note { font-size: 12.5px; color: var(--muted); }
.when { font-family: var(--mono); font-size: 12.5px; color: var(--ink-2); white-space: nowrap; text-align: right; }
:lang(zh) .when { font-family: var(--body); }
.when.late { color: var(--red); font-weight: 500; }
.when.soon { color: var(--amber); font-weight: 500; }
.chip { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.chip.hard { background: var(--rose-soft); color: var(--rose); }
.chip.owner { background: transparent; border: 1px solid var(--line); font-weight: 500; }
.empty { padding: 18px; color: var(--muted); text-align: center; }

/* Workstream grid */
.ws-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 900px) { .ws-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .ws-grid { grid-template-columns: minmax(0, 1fr); } }
.ws { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; text-align: left; cursor: pointer; color: inherit; min-width: 0; }
.ws:hover { border-color: var(--line-2); }
.ws .top-line { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.ws .count { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
.bar { height: 5px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--green); }
.ws .next { font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }
.ws .next b { font-weight: 600; color: var(--ink); }
.ws .next.late b { color: var(--red); }

/* Team board */
.team { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; overflow: hidden; }
@media (max-width: 560px) { .team { grid-template-columns: minmax(0, 1fr); } }
.team > div { padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; min-width: 0; }
.team .role { font-weight: 600; font-size: 14px; }
.team .who { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.st { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.st.booked { background: var(--green-soft); color: var(--green); }
.st.quote { background: var(--amber-soft); color: var(--amber); }
.st.research { background: var(--blue-soft); color: var(--blue); }
.st.none { background: var(--surface-2); color: var(--muted); }

/* Toolbar */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 6px 12px; font-size: 13px; color: var(--ink-2); cursor: pointer; }
.seg button.on { background: var(--green-soft); color: var(--green); font-weight: 600; }
.pill { border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
.pill:hover { border-color: var(--line-2); }
.pill.on { background: var(--green-soft); border-color: transparent; color: var(--green); font-weight: 600; }
select, input[type=search] { font: inherit; font-size: 13px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
input[type=search] { flex: 1 1 180px; min-width: 0; }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--ink-2); cursor: pointer; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.group-title { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-top: 8px; }
.group-title h3 { font-family: var(--display); font-size: 1.2rem; font-weight: 600; }
.group-title span { font-family: var(--mono); font-size: 12px; color: var(--muted); }
:lang(zh) .group-title span { font-family: var(--body); }
.edit { font-size: 12.5px; color: var(--ink-2); text-decoration: none; border: 1px solid var(--line); border-radius: 7px; padding: 5px 10px; background: var(--surface); white-space: nowrap; }
.edit:hover { color: var(--green); border-color: var(--line-2); }

/* Tables */
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
.table-wrap table { min-width: 600px; }
th { text-align: left; font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); background: var(--surface-2); padding: 9px 14px; border-bottom: 1px solid var(--line); }
td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--ink-2); }
td:first-child { color: var(--ink); }
tr:last-child td { border-bottom: none; }
.num { text-align: right; white-space: nowrap; font-family: var(--mono); font-variant-numeric: tabular-nums; }
td a { color: var(--ink); font-weight: 500; text-decoration: none; }
td a:hover { color: var(--green); text-decoration: underline; }

/* Budget */
.calc { padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
.calc .row-i { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.calc label { font-weight: 600; }
.calc input[type=range] { flex: 1 1 220px; accent-color: var(--green); }
.calc output { font-family: var(--mono); font-size: 1.4rem; color: var(--green); min-width: 4ch; }
.totals { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 640px) { .totals { grid-template-columns: minmax(0, 1fr); } }
.totals div { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; }
.totals .k { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
.totals .v { font-family: var(--mono); font-size: 1.1rem; }

/* Day-of */
.day { display: grid; grid-template-columns: 84px minmax(0, 1fr); overflow: hidden; }
.day > div { padding: 10px 14px; border-bottom: 1px solid var(--line); }
.day > div:nth-last-child(-n+2) { border-bottom: none; }
.day .t { font-family: var(--mono); font-size: 13px; color: var(--green); background: var(--surface-2); border-right: 1px solid var(--line); }
.day .t.sun { color: var(--rose); }
.day .w { color: var(--ink-2); }
.day .w b { color: var(--ink); }

.flags { display: grid; gap: 10px; }
.flag { padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.flag.act { background: var(--amber-soft); border-color: transparent; }
.flag p { color: var(--ink-2); font-size: 14px; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 760px) { .two { grid-template-columns: minmax(0, 1fr); } }
.box { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.box ol, .box ul { margin: 0; padding-left: 20px; color: var(--ink-2); display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.box b { color: var(--ink); }
.err { background: var(--red-soft); color: var(--red); border-radius: 8px; padding: 10px 14px; font-size: 13.5px; }
footer { max-width: 1100px; margin: 0 auto; padding: 0 20px 40px; font-size: 12.5px; color: var(--muted); display: flex; gap: 6px 16px; flex-wrap: wrap; }
@media (max-width: 600px) { .top-inner, main, footer { padding-left: 16px; padding-right: 16px; } .brand h1 { font-size: 1.25rem; } }
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <div>
        <h1>Johnny <em>&amp;</em> Irene</h1>
        <div class="sub" data-i18n="sub"></div>
      </div>
      <div class="brand-right">
        <button class="hbtn langbtn" id="langbtn" type="button" aria-label="Language / 语言"></button>
        <button class="hbtn" id="themebtn" type="button"></button>
        <span class="countdown" id="countdown"></span>
      </div>
    </div>
    <nav class="tabs" aria-label="Sections">
      <a href="#today" data-view="today" data-i18n="nav.today"></a>
      <a href="#plan" data-view="plan" data-i18n="nav.plan"></a>
      <a href="#money" data-view="money" data-i18n="nav.money"></a>
      <a href="#vendors" data-view="vendors" data-i18n="nav.vendors"></a>
      <a href="#day" data-view="day" data-i18n="nav.day"></a>
      <a href="#venue" data-view="venue" data-i18n="nav.venue"></a>
    </nav>
  </div>
</header>

<main>
  <!-- TODAY -->
  <section class="view" id="view-today">
    <div class="card trip" id="trip"></div>
    <div class="stats">
      <div class="card stat" id="st-overdue"><span class="k" data-i18n="st.overdue"></span><span class="v">–</span><span class="d" data-i18n="st.overdue.d"></span></div>
      <div class="card stat" id="st-soon"><span class="k" data-i18n="st.soon"></span><span class="v">–</span><span class="d" data-i18n="st.soon.d"></span></div>
      <div class="card stat" id="st-hard"><span class="k" data-i18n="st.hard"></span><span class="v">–</span><span class="d"></span></div>
      <div class="card stat" id="st-done"><span class="k" data-i18n="st.done"></span><span class="v">–</span><span class="d" data-i18n="st.done.d"></span></div>
    </div>
    <div class="cols">
      <div class="block">
        <div class="block-head"><h2 data-i18n="h.attention"></h2><a class="edit" href="#plan" data-i18n="btn.alltasks"></a></div>
        <p class="small" data-i18n="p.attention"></p>
        <div class="card list" id="attention"><div class="empty" data-i18n="loading"></div></div>
      </div>
      <div class="block">
        <div class="block-head"><h2 data-i18n="h.booked"></h2><a class="edit" href="#vendors" data-i18n="nav.vendors"></a></div>
        <div class="card team" id="team-mini"></div>
      </div>
    </div>
    <div class="block">
      <div class="block-head"><h2 data-i18n="h.ws"></h2><span class="small" data-i18n="p.ws"></span></div>
      <div class="ws-grid" id="ws-grid"></div>
    </div>
  </section>

  <!-- PLAN -->
  <section class="view" id="view-plan" hidden>
    <div class="block-head"><h2 data-i18n="h.plan"></h2><a class="edit" id="notion-tasks" target="_blank" rel="noopener" data-i18n="btn.notion"></a></div>
    <div class="toolbar">
      <div class="seg" role="group">
        <button type="button" id="g-month" class="on" data-i18n="btn.bymonth"></button>
        <button type="button" id="g-ws" data-i18n="btn.byws"></button>
      </div>
      <select id="f-owner" aria-label="Owner"></select>
      <label class="check"><input type="checkbox" id="f-hide" checked> <span data-i18n="btn.hidedone"></span></label>
      <input type="search" id="f-q" data-i18n-ph="ph.search">
    </div>
    <div class="pills" id="f-ws"></div>
    <div id="plan-list" class="block"></div>
  </section>

  <!-- MONEY -->
  <section class="view" id="view-money" hidden>
    <div class="block">
      <h2 data-i18n="h.pay"></h2>
      <p class="lede" data-i18n="p.pay"></p>
      <div class="card table-wrap"><table>
        <thead><tr><th data-i18n="th.date"></th><th data-i18n="th.what"></th><th class="num" data-i18n="th.amount"></th></tr></thead>
        <tbody id="pay-rows"></tbody>
      </table></div>
      <p class="small" data-i18n="p.pay.note"></p>
    </div>
    <div class="block">
      <h2 data-i18n="h.budget"></h2>
      <p class="lede" data-i18n="p.budget"></p>
      <div class="card calc">
        <div class="row-i">
          <label for="guests" data-i18n="lbl.guests"></label>
          <input type="range" id="guests" min="120" max="250" step="5" value="230">
          <output id="guests-out" for="guests">230</output>
        </div>
        <p class="small" data-i18n="p.calc"></p>
        <div class="totals">
          <div><span class="k" data-i18n="tot.core"></span><div class="v" id="t-core">–</div></div>
          <div><span class="k" data-i18n="tot.rest"></span><div class="v" id="t-rest">–</div></div>
          <div><span class="k" data-i18n="tot.all"></span><div class="v" id="t-all">–</div></div>
        </div>
      </div>
      <div class="card table-wrap"><table>
        <thead><tr><th data-i18n="th.line"></th><th data-i18n="th.basis"></th><th class="num" data-i18n="th.low"></th><th class="num" data-i18n="th.high"></th></tr></thead>

function renderStatic() {
  document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); el.setAttribute('aria-label', t(el.dataset.i18nPh)); });
  $('#day-rows').innerHTML = DAY.map(d => `<div class="t${d[2] ? ' ' + d[2] : ''}">${d[0]}</div><div class="w">${pick(d[1])}</div>`).join('');
  $('#list-point').innerHTML = POINT.map(x => `<li>${esc(pick(x))}</li>`).join('');
  $('#list-banned').innerHTML = BANNED.map(x => `<li>${esc(pick(x))}</li>`).join('');
  $('#flags').innerHTML = FLAGS.map(f => `<div class="card flag${f[0] ? ' act' : ''}"><h3>${esc(pick(f[1]))}</h3><p>${esc(pick(f[2]))}</p></div>`).join('');
  $('#list-ask').innerHTML = ASK.map(x => `<li>${esc(pick(x))}</li>`).join('');
  $('#list-req').innerHTML = REQ.map(x => `<li>${pick(x)}</li>`).join('');
  $('#rule-rows').innerHTML = RULES.map(r => `<tr><td>${esc(pick(r[0]))}</td><td>${esc(pick(r[1]))}</td></tr>`).join('');
  $('#notion-tasks').href = TASKS_URL;
  $('#notion-hub').href = HUB_URL;
  const days = Math.ceil((WEDDING - new Date()) / 86400000);
  $('#countdown').textContent = days > 0 ? t('daysToGo')(days) : t('married');
  $('#langbtn').innerHTML = lang === 'zh' ? 'EN<i>|</i><b>中文</b>' : '<b>EN</b><i>|</i>中文';
  $('#updated').textContent = updated ? t('updated')(ago(updated)) : (tasks.length ? '' : t('notLoaded'));
  applyTheme();
}
function renderAll() {
  renderStatic(); renderPayments(); renderBudget();
  renderToday(); renderTeam('#team-mini', true); renderTeam('#team-full', false); renderShortlist();
  if (location.hash === '#plan') renderPlan();
}

/* ---------------- router ---------------- */
const VIEWS = ['today', 'plan', 'money', 'vendors', 'day', 'venue'];
function route() {
  let v = location.hash.replace('#', '');
  if (!VIEWS.includes(v)) v = 'today';
  VIEWS.forEach(id => { document.getElementById('view-' + id).hidden = id !== v; });
  document.querySelectorAll('nav.tabs a').forEach(a => a.classList.toggle('on', a.dataset.view === v));
  if (v === 'plan') renderPlan();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);

/* ---------------- controls ---------------- */
$('#g-month').addEventListener('click', () => { state.group = 'month'; renderPlan(); });
$('#g-ws').addEventListener('click', () => { state.group = 'ws'; renderPlan(); });
$('#f-owner').addEventListener('change', e => { state.owner = e.target.value; renderPlan(); });
$('#f-hide').addEventListener('change', e => { state.hideDone = e.target.checked; renderPlan(); });
$('#f-q').addEventListener('input', e => { state.q = e.target.value; renderPlan(); });
$('#guests').addEventListener('input', renderBudget);
$('#s-team').addEventListener('click', () => { state.shortlist = 'team'; renderShortlist(); });
$('#s-floral').addEventListener('click', () => { state.shortlist = 'floral'; renderShortlist(); });
$('#langbtn').addEventListener('click', () => {
  lang = lang === 'zh' ? 'en' : 'zh';
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  try { localStorage.setItem('wedlang', lang); } catch (e) {}
  renderAll();
});

/* theme: Auto follows the device, same three modes as HQ */
const MODES = ['auto', 'light', 'dark'];
let mode = 'auto';
try { mode = localStorage.getItem('wedtheme') || 'auto'; } catch (e) {}
if (!MODES.includes(mode)) mode = 'auto';
function applyTheme() {
  if (mode === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', mode);
  $('#themebtn').textContent = t('theme') + t('colon') + t('theme.' + mode);
}
$('#themebtn').addEventListener('click', () => {
  mode = MODES[(MODES.indexOf(mode) + 1) % 3];
  try { localStorage.setItem('wedtheme', mode); } catch (e) {}
  applyTheme();
});

/* ---------------- load ---------------- */
async function getJSON(name) {
  const r = await fetch('./' + name + '?t=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error(name + ' could not be loaded (' + r.status + ')');
  return r.json();
}
async function load() {
  const [tk, v, m, meta] = await Promise.allSettled([getJSON('tasks.json'), getJSON('vendors.json'), getJSON('team.json'), getJSON('task-meta.json')]);
  if (tk.status === 'fulfilled') { tasks = tk.value.data || []; updated = tk.value.updated; }
  if (v.status === 'fulfilled') vendors = v.value.data || [];
  if (m.status === 'fulfilled') team = m.value.data || [];
  // task-meta.json adds the Chinese name and notes, plus Workstream and Hard date until the Notion sync pulls them itself
  const extra = meta.status === 'fulfilled' ? meta.value.tasks || {} : {};
  tasks.forEach(x => {
    const id = ((x.url || '').match(/([0-9a-f]{32})(?:\?|$)/) || [])[1];
    const e = id && extra[id];
    if (!e) return;
    if (!x.workstream) x.workstream = e.workstream;
    if (x.hard == null) x.hard = e.hard;
    x.zh = e.zh; x.zhNotes = e.zhNotes;
  });
  renderAll();
  if (tk.status !== 'fulfilled') $('#attention').innerHTML = `<div class="err">${esc(tk.reason.message)}</div>`;
  route();
}

renderAll();
route();
load();
</script>
