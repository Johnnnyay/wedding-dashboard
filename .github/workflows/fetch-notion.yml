name: Fetch Notion Data

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Notion databases
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import json, urllib.request, os
          from datetime import datetime, timezone

          TOKEN = os.environ['NOTION_TOKEN']

          def query_db(db_id):
              url = f'https://api.notion.com/v1/databases/{db_id}/query'
              results = []
              cursor = None
              while True:
                  body = {'page_size': 100}
                  if cursor:
                      body['start_cursor'] = cursor
                  req = urllib.request.Request(
                      url,
                      data=json.dumps(body).encode(),
                      headers={
                          'Authorization': f'Bearer {TOKEN}',
                          'Notion-Version': '2022-06-28',
                          'Content-Type': 'application/json'
                      },
                      method='POST'
                  )
                  with urllib.request.urlopen(req) as r:
                      data = json.loads(r.read())
                  results.extend(data.get('results', []))
                  if not data.get('has_more'):
                      break
                  cursor = data['next_cursor']
              return results

          def gp(props, name):
              """Get flattened value from a Notion property."""
              p = props.get(name)
              if not p:
                  return None
              t = p.get('type', '')
              if t == 'title':
                  return ''.join(i.get('plain_text', '') for i in p.get('title', []))
              if t == 'rich_text':
                  return ''.join(i.get('plain_text', '') for i in p.get('rich_text', []))
              if t == 'select':
                  return p['select']['name'] if p.get('select') else None
              if t == 'multi_select':
                  return ', '.join(o['name'] for o in p.get('multi_select', []))
              if t == 'status':
                  return p['status']['name'] if p.get('status') else None
              if t == 'date':
                  return p['date']['start'] if p.get('date') else None
              if t == 'number':
                  return p.get('number')
              if t == 'checkbox':
                  return p.get('checkbox', False)
              if t == 'url':
                  return p.get('url')
              if t == 'email':
                  return p.get('email')
              if t == 'phone_number':
                  return p.get('phone_number')
              return None

          now = datetime.now(timezone.utc).isoformat()

          # ââ Tasks ââââââââââââââââââââââââââââââââââââââââââââââ
          print('Fetching Tasks...')
          tasks_raw = query_db('fdb8441d07b546f086d0ac978d067279')
          tasks = []
          for r in tasks_raw:
              p = r['properties']
              tasks.append({
                  'name': gp(p, 'Name') or '',
                  'status': gp(p, 'Status') or '',
                  'dueDate': gp(p, 'Due Date') or '',
                  'owner': gp(p, 'Owner') or '',
                  'phase': gp(p, 'Phase') or '',
                  'notes': gp(p, 'Notes') or '',
                  'url': r.get('url', '')
              })
          with open('tasks.json', 'w') as f:
              json.dump({'updated': now, 'data': tasks}, f)
          print(f'Tasks: {len(tasks)} rows written')

          # ââ Vendors ââââââââââââââââââââââââââââââââââââââââââââ
          print('Fetching Vendors...')
          vendors_raw = query_db('2173e66d960b442c8a1c64ddfee6bd87')
          vendors = []
          for r in vendors_raw:
              p = r['properties']
              vendors.append({
                  'name': gp(p, 'Name') or '',
                  'tier': gp(p, 'Tier') or '',
                  'status': gp(p, 'Status') or '',
                  'region': gp(p, 'Region') or '',
                  'category': gp(p, 'Category') or '',
                  'notes': gp(p, 'Notes') or '',
                  'url': r.get('url', '')
              })
          with open('vendors.json', 'w') as f:
              json.dump({'updated': now, 'data': vendors}, f)
          print(f'Vendors: {len(vendors)} rows written')

          # ââ Creative Team ââââââââââââââââââââââââââââââââââââââ
          print('Fetching Creative Team...')
          team_raw = query_db('17d4e3625e924f46a21eb30409e7fe2b')
          team = []
          for r in team_raw:
              p = r['properties']
              team.append({
                  'name': gp(p, 'Name') or '',
                  'category': gp(p, 'Category') or '',
                  'tier': gp(p, 'Tier') or '',
                  'status': gp(p, 'Status') or '',
                  'score': gp(p, 'Score /80'),
                  'priceEst': gp(p, 'Price Est.') or '',
                  'location': gp(p, 'Location') or '',
                  'publications': gp(p, 'Publications') or '',
                  'notes': gp(p, 'Notes') or '',
                  'website': gp(p, 'Website') or '',
                  'url': r.get('url', '')
              })
          with open('team.json', 'w') as f:
              json.dump({'updated': now, 'data': team}, f)
          print(f'Team: {len(team)} rows written')
          PYEOF

      - name: Commit updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tasks.json vendors.json team.json
          git diff --staged --quiet && echo "No changes" || (git commit -m "chore: refresh Notion data [skip ci]" && git push)
